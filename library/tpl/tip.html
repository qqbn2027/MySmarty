<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{$title}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-size: 16px;
            min-height: 100%;
            background-color: #f4f6f9;
        }

        .box {
            padding: 20px 50px;
            max-width: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border: 1px solid #dadada;
            border-radius: 5px;
        }

        .left {
            margin-right: 50px;
        }

        .right {
            flex: 1;
        }

        h3.title {
            color: #313435;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .msg {
            color: #72777a;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .jump a {
            color: #fff;
            background-color: #2196f3;
            border-color: #2196f3;
            display: inline-block;
            font-weight: 400;
            line-height: 1.5;
            text-align: center;
            text-decoration: none;
            vertical-align: middle;
            cursor: pointer;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
            border-radius: 0.25rem;
        }

        @media screen and (max-width: 960px) {
            .left {
                display: none !important;
            }
        }

        .icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        .icon::after {
            color: #fff;
            font-size: 40px;
            font-weight: bold;
        }


        .icon-{$icon} {
            background-color: #e74a3b;
        }

        .icon-{$icon}::after {
            content: '{$icon}';
            font-size: 24px !important;
        }

        .icon-success {
            background-color: #1cc88a !important;
        }

        .icon-success::after {
            content: '✓' !important;
        }

        .icon-fail {
            background-color: #e74a3b !important;
        }

        .icon-fail::after {
            content: '!' !important;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="left">
        <span class="icon icon-{$icon}"></span>
    </div>
    <div class="right">
        <h3 class="title">{$tip}</h3>
        <div class="msg">
            {$msg}
        </div>
        <div class="jump">
            <a href="{$url}" title="{$jump}">{$jump}</a>
        </div>
    </div>
</div>
</body>
</html>
